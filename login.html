<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Covenant Crest Academy</title>
  <link rel="stylesheet" href="./src/css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="./index.html">
      <img src="./public/images/logo.jpg" alt="Covenant Crest Academy">
    </a>
    <section class="auth-card">
      <p class="eyebrow">School Portal</p>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to continue to your Covenant Crest Academy portal.</p>
      <form id="login-form">
        <label>Email<input type="email" id="email" required autocomplete="email"></label>
        <label>Password<input type="password" id="password" required autocomplete="current-password"></label>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
      <div id="message" class="form-message"></div>\n      <a class="back-link" href="./signup.html">Parent? Create an account</a>
      <a class="back-link" href="./index.html">← Back to school website</a>
    </section>
  </main>
  <script type="module" src="./src/js/login.js"></script>
</body>
</html>
