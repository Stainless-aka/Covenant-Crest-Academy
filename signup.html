<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Parent Registration — Covenant Crest Academy</title><link rel="stylesheet" href="./src/css/styles.css">  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body class="auth-page"><main class="auth-shell"><a class="auth-brand" href="./index.html"><img src="./public/images/logo.jpg" alt="Covenant Crest Academy" decoding="async"></a>
<section class="auth-card"><p class="eyebrow">Parent Portal</p><h1>Create account</h1><p class="muted">Create your parent account. The school will link your child after registration.</p>
<form id="signup-form"><label>Full name<input id="full-name" required autocomplete="name"></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" minlength="6" required autocomplete="new-password"></label><label>Confirm password<input id="confirm" type="password" minlength="6" required autocomplete="new-password"></label><button class="btn btn-primary btn-block">Create Parent Account</button></form>
<div id="message" class="form-message"></div><a class="back-link" href="./login.html">Already have an account? Sign in</a></section></main><script type="module" src="./src/js/signup.js"></script></body></html>
